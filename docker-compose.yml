name: deliveryops-intelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: deliveryops-postgres
    profiles: ["core", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deliveryops}
      POSTGRES_USER: ${POSTGRES_USER:-deliveryops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deliveryops_local_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=50"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deliveryops} -d ${POSTGRES_DB:-deliveryops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-ui:
    image: adminer:latest
    container_name: deliveryops-pg-ui
    profiles: ["core", "all"]
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "8082:8080"
    mem_limit: 96m
    cpus: 0.25

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.4
    container_name: deliveryops-redpanda
    profiles: ["streaming", "all"]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=256M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    mem_limit: 384m
    cpus: 1.00

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: deliveryops-redpanda-console
    profiles: ["streaming", "all"]
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    mem_limit: 160m
    cpus: 0.25

  minio:
    image: pgsty/minio:latest
    container_name: deliveryops-minio
    profiles: ["storage", "all"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    mem_limit: 256m
    cpus: 0.50

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: deliveryops-jaeger
    profiles: ["observability", "all"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "5000"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
    mem_limit: 256m
    cpus: 0.50

  localstack:
    image: localstack/localstack:3.0
    container_name: deliveryops-localstack
    profiles: ["cloud", "all"]
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    mem_limit: 384m
    cpus: 0.50

volumes:
  pgdata:
  redpandadata:
  miniodata:
  localstackdata:
